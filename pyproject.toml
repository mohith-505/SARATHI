[project]
name = "sarathi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9", "pydantic-settings>=2.5", "httpx>=0.27",
  "typer>=0.12", "rich>=13.8", "pyyaml>=6.0", "tenacity>=9.0",
]
[project.scripts]
sarathi = "sarathi.cli.main:app"
[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
